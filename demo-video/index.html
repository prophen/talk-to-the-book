<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      /* The app's dark palette, so the recording's own background meets the frame. */
      :root {
        --ground: #1b1120;
        --ink: #f6ece1;
        --muted: #bca9b3;
        --p1: #13808b;
        --p2: #f2a93b;
        --p3: #8a3274;
        --p4: #c94a16;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
      /* Untimed wrapper: GSAP pushes in on it; the videos inside are the timed clips. */
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      .rec {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="115"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>

      <div id="cam">
        <!-- 1 Talk: landing, then upload and Scribe transcribing (wait at 2x) -->
        <video id="rec-landing" class="clip rec" src="assets/recording.mp4" muted playsinline
          data-start="4" data-duration="6" data-media-start="0" data-track-index="1"></video>
        <video id="rec-upload" class="clip rec" src="assets/recording.mp4" muted playsinline
          data-start="10" data-duration="11" data-media-start="6" data-playback-rate="2" data-track-index="1"></video>
        <!-- 2 Draft: Gemma drafting overlay, then the filed draft -->
        <video id="rec-drafting" class="clip rec" src="assets/recording.mp4" muted playsinline
          data-start="21" data-duration="6" data-media-start="28" data-track-index="1"></video>
        <video id="rec-filed" class="clip rec" src="assets/recording.mp4" muted playsinline
          data-start="27" data-duration="19" data-media-start="34" data-track-index="1"></video>
        <!-- 3 Hear: pick a voice, wait for ElevenLabs at 4x, then the real read-back -->
        <video id="rec-voice" class="clip rec" src="assets/recording.mp4" muted playsinline
          data-start="46" data-duration="4" data-media-start="53" data-track-index="1"></video>
        <video id="rec-wait" class="clip rec" src="assets/recording.mp4" muted playsinline
          data-start="50" data-duration="3.75" data-media-start="57" data-playback-rate="4" data-track-index="1"></video>
        <video id="rec-readback" class="clip rec" src="assets/recording.mp4" playsinline data-has-audio="true"
          data-start="53.75" data-duration="28" data-media-start="71.75" data-volume="1" data-fade-in="0.3" data-fade-out="1.5" data-track-index="1"></video>
        <video id="rec-readback-fast" class="clip rec" src="assets/recording.mp4" muted playsinline
          data-start="81.75" data-duration="13.75" data-media-start="99.75" data-playback-rate="4" data-track-index="1"></video>
        <!-- 4 Save: saved on this device, the four-part outline -->
        <video id="rec-saved" class="clip rec" src="assets/recording.mp4" muted playsinline
          data-start="95.5" data-duration="12" data-media-start="154.75" data-track-index="1"></video>
      </div>

      <div id="rail" data-composition-id="rail" data-composition-src="compositions/rail.html"
        data-start="4" data-duration="103.5" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html"
        data-start="0" data-duration="4" data-track-index="3" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="107.5" data-duration="7.5" data-track-index="3" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <!-- Narration (Kokoro af_heart, generated from script/n*.txt) -->
      <audio id="vo-1" class="clip" src="assets/voice/n1.wav" data-start="0.6" data-duration="6.44" data-volume="1" data-track-index="5"></audio>
      <audio id="vo-2" class="clip" src="assets/voice/n2.wav" data-start="11" data-duration="6.42" data-volume="1" data-track-index="5"></audio>
      <audio id="vo-3" class="clip" src="assets/voice/n3.wav" data-start="21.6" data-duration="2.99" data-volume="1" data-track-index="5"></audio>
      <audio id="vo-4" class="clip" src="assets/voice/n4.wav" data-start="28.2" data-duration="14.95" data-volume="1" data-track-index="5"></audio>
      <audio id="vo-5" class="clip" src="assets/voice/n5.wav" data-start="46.6" data-duration="4.69" data-volume="1" data-track-index="5"></audio>
      <audio id="vo-6" class="clip" src="assets/voice/n6.wav" data-start="83" data-duration="10.09" data-volume="1" data-track-index="5"></audio>
      <audio id="vo-7" class="clip" src="assets/voice/n7.wav" data-start="96" data-duration="11.31" data-volume="1" data-track-index="5"></audio>
      <audio id="vo-8" class="clip" src="assets/voice/n8.wav" data-start="109" data-duration="3.09" data-volume="1" data-track-index="5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Push-ins on the app column so its text reads at 1080p. To centre source row c at scale s,
      // y = -s * (c - 540). Held at 1x where the recording already zooms itself (46-58s).
      const cam = [
        [0, 1, 0],
        [12.5, 1.3, 0],
        [21, 1.5, 75],
        [27, 1.4, 0],
        [46, 1, 0],
        [58.5, 1.5, -125],
        [95.5, 1.4, -140],
      ];
      tl.set("#cam", { scale: 1, y: 0 }, 0);
      cam.slice(1).forEach(([at, scale, y]) => {
        tl.to("#cam", { scale, y, duration: 0.5, ease: "power2.inOut" }, at - 0.25);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
